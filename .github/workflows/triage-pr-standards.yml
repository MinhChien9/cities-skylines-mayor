name: triage-pr-standards

# Every PR title is `type(scope): summary` and every non-docs PR links the issue it
# resolves (`Closes #123` / `Fixes #123`). Labels and one comment explain what is missing;
# the check does not block a merge, the reviewer does.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const title = pr.title || '';
            const body = pr.body || '';

            const titleOk = /^(feat|fix|docs|chore|refactor|test)(\([a-z0-9-]+\))?: \S/.test(title);
            const isDocs = /^docs(\(|:)/.test(title);
            const linksIssue = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body);

            async function setLabel(name, on) {
              if (on) {
                await github.rest.issues.addLabels({ ...repo, issue_number: pr.number, labels: [name] });
              } else {
                try { await github.rest.issues.removeLabel({ ...repo, issue_number: pr.number, name }); } catch (e) {}
              }
            }

            async function commentOnce(marker, text) {
              const tag = `<!-- pr-standards:${marker} -->`;
              const { data: comments } = await github.rest.issues.listComments({ ...repo, issue_number: pr.number });
              if (comments.some(c => c.body.includes(tag))) return;
              await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body: `${tag}\n${text}` });
            }

            await setLabel('needs:title', !titleOk);
            if (!titleOk) {
              await commentOnce('title', 'The title should be `type(scope): summary` with a type of feat, fix, docs, chore, refactor or test (see `.github/CONTRIBUTING.md`).');
            }

            const needsIssue = !isDocs && !linksIssue;
            await setLabel('needs:issue', needsIssue);
            if (needsIssue) {
              await commentOnce('issue', 'Work starts from an issue in this repo. Add `Closes #<number>` to the description, or open the issue first (`docs/13-development-process.md`).');
            }

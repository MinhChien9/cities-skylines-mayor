name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-server:
    name: MCP server (build, test, smoke)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The in-game mod compiles against Cities: Skylines' own runtime assemblies,
      # which cannot be redistributed, so it is not built here. The MCP server and the
      # test project are, and they have no such dependency.
      #
      # The solution (Cs1Mayor.sln) also contains src/SkylinesAgentBridge.csproj, so the
      # projects are built individually rather than through the solution.

      - name: Restore
        run: |
          dotnet restore ./mcp-server/Cs1Mayor.Mcp.csproj
          dotnet restore ./tests/Cs1Mayor.Mcp.Tests/Cs1Mayor.Mcp.Tests.csproj

      - name: Build
        run: |
          dotnet build ./mcp-server/Cs1Mayor.Mcp.csproj -c Release --no-restore
          dotnet build ./tests/Cs1Mayor.Mcp.Tests/Cs1Mayor.Mcp.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ./tests/Cs1Mayor.Mcp.Tests/Cs1Mayor.Mcp.Tests.csproj -c Release --no-build

      - name: MCP stdio smoke test
        run: python ./scripts/smoke-test-mcp.py

      - name: Check that the documented endpoints match the route table
        run: python ./scripts/check-api-docs.py

      - name: Check that the mod build script parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/build-mod.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "build-mod.ps1 parses cleanly"

      # The mod itself is built locally, against a real installation:
      #   powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-mod.ps1
      # See docs/02-getting-started.md.

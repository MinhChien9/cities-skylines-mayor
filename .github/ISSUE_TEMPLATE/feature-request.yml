name: Feature request
description: A new tool, endpoint, game read or lever
title: "[FEATURE]: "
labels: ["feature", "needs-triage"]
body:
  - type: checkboxes
    id: verified
    attributes:
      label: Not requested before
      options:
        - label: I searched the open and closed issues and docs/12-command-surface.md.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that you cannot do now?
      description: The play situation it comes from helps more than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or endpoint
      description: Name, arguments, response. Mark game APIs you verified with [V] and guesses with [?].

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Bridge (in-game mod, src/)
        - MCP server (mcp-server/)
        - Docs / AGENTS.md
        - Scripts / CI
